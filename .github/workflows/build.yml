name: CI

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev
        # pip-ன் புதிய பதிப்பால் வரும் பிழையைத் தவிர்க்க பழைய நிலையான பதிப்பைப் பயன்படுத்துதல்
        python3 -m pip install --upgrade "pip<24.0"
        pip install --user --upgrade buildozer cython==0.29.36 kivy
        pip install --user --upgrade git+https://github.com/kivy/python-for-android.git

    - name: Build with Buildozer
      env:
        ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/25.2.9519653
        ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/25.2.9519653
        ANDROID_NDK: /usr/local/lib/android/sdk/ndk/25.2.9519653
      run: |
        export PATH=$PATH:~/.local/bin
        ANDROID_NDK_HOME=/usr/local/lib/android/sdk/ndk/25.2.9519653
        ANDROID_NDK_ROOT=/usr/local/lib/android/sdk/ndk/25.2.9519653
        ANDROID_NDK=/usr/local/lib/android/sdk/ndk/25.2.9519653
        yes | buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk
